[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-api"
version = "0.1.0"
description = "API de ejemplo con FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mi_api"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = false